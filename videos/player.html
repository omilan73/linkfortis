<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewShield — Demostración en vídeo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html, body{
    width:100%;
    height:100%;
    background:#122B33; /* Color corporativo teal-deep */
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:'IBM Plex Sans', Arial, sans-serif;
  }
  .video-wrapper{
    position:relative;
    width:100%;
    height:100%;
    max-width:1280px;
    max-height:720px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  video{
    width:100%;
    height:100%;
    object-fit:contain;
    outline:none;
    background:#000;
  }
</style>
</head>
<body>

<div class="video-wrapper">
  <video 
    controls 
    playsinline 
    preload="metadata" 
    poster="/img/logo_reviewshield.jpeg">
    <source src="videoRS.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video.
  </video>
</div>

</body>
</html>
